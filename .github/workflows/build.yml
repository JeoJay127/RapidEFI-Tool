name: Build & Release

# ── 触发规则 ────────────────────────────────────────────
# push main/master  → Beta（自动，固定 tag "beta"，每次发布先删除旧 Release）
# workflow_dispatch → Release（手动输入版本号，生成 tag "vX.Y.Z"）
# ─────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v5.9.0 或 v5.9，v 可省略）'
        required: true
        type: string

env:
  APP_NAME: RapidEFI
  FLUTTER_VERSION: '3.41.9'

# 同一 ref 的旧构建自动取消（仅 push 的 beta 构建；手动发布不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ──────────────────────────────────────────────────────
  # 1. 解析发布通道 & tag
  # ──────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      channel:    ${{ steps.info.outputs.channel }}
      tag:        ${{ steps.info.outputs.tag }}
      version:    ${{ steps.info.outputs.version }}
      overwrite:  ${{ steps.info.outputs.overwrite }}  # "true" → 覆盖固定 tag（beta）

    steps:
      - name: Resolve channel / tag / version
        id: info
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "push" ]; then
            # ── Beta：push 到主分支，固定 tag "beta" ──────
            CHANNEL=beta
            TAG=beta
            VERSION="beta.$(date -u +%Y%m%d%H%M).${GITHUB_SHA::7}"
            OVERWRITE=true
          else
            # ── Release：手动输入版本号（vX.Y.Z / X.Y.Z / X.Y）──
            CHANNEL=release
            RAW="$INPUT_VERSION"
            RAW="${RAW#v}"
            RAW="${RAW#V}"

            if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::版本号格式不正确：'${INPUT_VERSION}'（应类似 v5.9.0）"
              exit 1
            fi

            # pubspec 要求 major.minor.patch，输入 v5.9 时补成 5.9.0
            if [[ "$RAW" =~ ^[0-9]+\.[0-9]+$ ]]; then
              RAW="${RAW}.0"
            fi

            VERSION="$RAW"
            TAG="v${VERSION}"
            OVERWRITE=false
          fi

          echo "channel=$CHANNEL"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "overwrite=$OVERWRITE" >> "$GITHUB_OUTPUT"

          # Step summary
          {
            echo "### 📦 Build info"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Channel | \`$CHANNEL\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Overwrite tag | \`$OVERWRITE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────
  # 2. 矩阵构建：3 个组合
  # ──────────────────────────────────────────────────────
  build:
    name: Build · ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ────────────────────────────────
          - label:          Windows-x64
            runner:         windows-latest
            os:             windows
            arch:           x64
            build_dir:      build/windows/x64/runner/Release
            pkg_ext:        zip
            flutter_sdk_arch: x64      # 原生 x64 SDK
            flutter_manual: false

          # Windows-arm64 暂时禁用
          # - label:          Windows-arm64
          #   runner:         windows-11-arm
          #   os:             windows
          #   arch:           arm64
          #   build_dir:      build/windows/arm64/runner/Release
          #   pkg_ext:        zip
          #   flutter_sdk_arch: x64
          #   flutter_manual: false

          # ── Linux ──────────────────────────────────
          - label:          Linux-x64
            runner:         ubuntu-latest
            os:             linux
            arch:           x64
            build_dir:      build/linux/x64/release/bundle
            pkg_ext:        tar.gz
            flutter_sdk_arch: x64
            flutter_manual: false

          # Linux-arm64 暂时禁用（ubuntu-24.04-arm runner 网络不稳定）
          # - label:          Linux-arm64
          #   runner:         ubuntu-24.04-arm
          #   os:             linux
          #   arch:           arm64
          #   build_dir:      build/linux/arm64/release/bundle
          #   pkg_ext:        tar.gz
          #   flutter_sdk_arch: arm64
          #   flutter_manual: true

          # ── macOS ──────────────────────────────────
          - label:          macOS-universal
            runner:         macos-15
            os:             macos
            build_dir:      build/macos/Build/Products/Release
            pkg_ext:        zip
            flutter_sdk_arch: arm64
            flutter_manual: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux 系统依赖 ──────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          # ARM64 runner 用 ports.ubuntu.com 经常超时，切换到 Azure 镜像 + 强制 IPv4
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          # sources.list（传统格式）
          sudo sed -i 's|http://ports.ubuntu.com|http://azure.ports.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          # ubuntu.sources（Ubuntu 24.04 DEB822 格式）
          sudo sed -i 's|http://ports.ubuntu.com|http://azure.ports.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          sudo apt-get update -y
          sudo apt-get install -y -o Acquire::Retries=3 \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev libcairo2-dev \
            libgdk-pixbuf2.0-dev libatk1.0-dev

      # ── Flutter：action（除 Linux arm64 外全部使用）────
      - name: Setup Flutter
        if: "!matrix.flutter_manual"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: ${{ matrix.flutter_sdk_arch }}

      # ── Flutter：手动安装（仅 Linux arm64）────────────
      # subosito/flutter-action 无法自动发现 linux/arm64 版本
      - name: Setup Flutter (Linux arm64, manual)
        if: matrix.flutter_manual
        shell: bash
        run: |
          BASE="https://storage.googleapis.com/flutter_infra_release/"
          JSON=$(curl -fsSL "${BASE}releases/releases_linux.json")
          VER="${{ env.FLUTTER_VERSION }}"

          # 优先从 JSON archive 字段获取 arm64 路径（最可靠，不用猜文件名格式）
          ARCHIVE=$(echo "$JSON" | jq -r --arg ver "$VER" '
            .releases[] |
            select(.version == $ver) |
            select(.archive | test("arm64"; "i")) |
            .archive
          ' | head -1)

          # 回退：版本号拼 URL
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="releases/stable/linux/flutter_linux_arm64_${VER}-stable.tar.xz"
          fi

          echo "Downloading: ${BASE}${ARCHIVE}"
          curl -fsSL "${BASE}${ARCHIVE}" -o flutter.tar.xz
          tar xf flutter.tar.xz -C "$HOME"
          rm flutter.tar.xz
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - run: flutter pub get

      # ── Windows：设置与构建目标架构匹配的 JDK ─────────
      # windows-latest 现已是 ARM64 runner，默认 JDK 也是 aarch64；
      # jni 插件链接时需要与目标架构一致的 jvm.lib，必须显式指定。
      - name: Setup Java (match build arch)
        if: matrix.os == 'windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch }}

      # ── 修复 permission_handler_windows 在 MSVC 14.51+ 下的 C2338 错误 ──
      # CMAKE_CXX_FLAGS 无法可靠传递到插件 vcxproj，直接 patch pub cache 是唯一可靠方案
      - name: Patch permission_handler_windows (MSVC coroutine compat)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $hosted = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
          $dirs   = Get-ChildItem -Path $hosted -Filter "permission_handler_windows*" -Directory -ErrorAction SilentlyContinue
          foreach ($dir in $dirs) {
            $cmake = Join-Path $dir.FullName "windows\CMakeLists.txt"
            if (Test-Path $cmake) {
              $txt = Get-Content $cmake -Raw
              if ($txt -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
                Add-Content -Path $cmake -Value "`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
                Write-Host "Patched: $cmake"
              } else {
                Write-Host "Already patched: $cmake"
              }
            }
          }

      # ── 版本号写入 pubspec.yaml ─────────────────────
      # pubspec 只接受 X.Y.Z+buildNumber 格式（纯整数）
      # release：用输入的版本号；beta：保留原有 X.Y.Z，只更新 build number
      - name: Patch pubspec version
        shell: bash
        run: |
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          if [ "$CHANNEL" = "release" ]; then
            SEMVER="${{ needs.prepare.outputs.version }}"
          else
            # 从 pubspec.yaml 读取当前语义版本（去掉已有的 +build 部分）
            SEMVER=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          fi
          sed -i.bak "s/^version: .*/version: ${SEMVER}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      # ── 构建 ───────────────────────────────────────
      - name: Build
        shell: bash
        run: flutter build ${{ matrix.os }} --release

      # ── 打包：Windows ───────────────────────────────
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Copy-Item -Path "docs\dll\*.dll" -Destination "${{ matrix.build_dir }}" -Force
          $dest = "${{ env.APP_NAME }}-${{ matrix.label }}.zip"
          Compress-Archive -Path "${{ matrix.build_dir }}\*" -DestinationPath $dest -Force

      # ── 打包：Linux ─────────────────────────────────
      - name: Package (Linux tar.gz)
        if: matrix.os == 'linux'
        run: |
          tar -czf "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-${{ matrix.label }}.tar.gz" \
              -C "${{ matrix.build_dir }}" .

      # ── 打包：macOS ─────────────────────────────────
      - name: Package (macOS zip)
        if: matrix.os == 'macos'
        run: |
          cd "${{ matrix.build_dir }}"
          zip -ry "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-${{ matrix.label }}.zip" *.app

      # ── 上传 ───────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: ${{ env.APP_NAME }}-${{ matrix.label }}.${{ matrix.pkg_ext }}
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # 3. 发布 Release
  #    beta    ：强制覆盖固定 tag "beta"（每次删除旧 Release 再发布）
  #    release ：创建正式版本 Release（tag = "vX.Y.Z"）
  # ──────────────────────────────────────────────────────
  release:
    name: Release · ${{ needs.prepare.outputs.tag }}
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 同一 tag 的发布串行执行，避免 beta Release 并发删建产生竞争
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ── 下载所有构建产物 ────────────────────────────
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      # ── beta：删除旧 release + tag，再将 tag 指向当前 commit 并发布 ──
      - name: Publish beta release (overwrite)
        if: needs.prepare.outputs.overwrite == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 1. 删除旧 release（含 tag），忽略不存在时的错误
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # 2. 强制推新 tag 到当前 commit
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git tag -f "$TAG"
          git push origin "$TAG" --force

          # 3. 创建新 release（printf 防止变量中的特殊字符被解析）
          NOTES=$(printf '自动构建（每次推送到主分支更新此 Release）。\n\n**版本快照：** `%s`\n**构建号：** #%s\n**Commit：** %s' \
            "$VERSION" "${{ github.run_number }}" "${{ github.sha }}")

          gh release create "$TAG" dist/* \
            --verify-tag \
            --prerelease \
            --title "🧪 Beta Build" \
            --notes "$NOTES"

      # ── release：创建正式版本 release ──────────────────
      - name: Publish release
        if: needs.prepare.outputs.overwrite == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ env.APP_NAME }} ${VERSION}" \
            --generate-notes \
            --latest
